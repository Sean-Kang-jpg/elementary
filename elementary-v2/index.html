<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>어디초 | 초등학교 배정 아파트 찾기</title>
    <!-- 릴리스 신선도 확인용. 제목에 있던 버전을 여기로 옮겼다. -->
    <meta name="app-version" content="{{APP_VERSION}}">
    <meta name="description" content="전국 17개 시·도의 아파트 단지별 공식 배정 초등학교를 지도에서 확인하세요. 학급 수, 학생 수, 주차·연식·세대수 조건으로 함께 비교할 수 있습니다.">
    <meta name="keywords" content="초등학교, 배정, 통학구역, 학군, 아파트, 이사, 학교 배정 조회">
    <link rel="canonical" href="{{SITE_ORIGIN}}/">
    <!--
      공유 미리보기용. 상세 주소에서는 api/detail.js가 이 값들을 그 페이지의
      것으로 갈아끼운다. 여기 있는 값은 지도 첫 화면과, 함수가 실패해 셸이
      그대로 나갈 때 쓰인다 - 그때 미리보기가 비어 보이지 않게 하는 것이 목적이다.
    -->
    <meta property="og:site_name" content="어디초">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="어디초 | 초등학교 배정 아파트 찾기">
    <meta property="og:description" content="전국 17개 시·도의 아파트 단지별 공식 배정 초등학교를 지도에서 확인하세요.">
    <meta property="og:url" content="{{SITE_ORIGIN}}/">
    <!--
      상세 페이지도 이 이미지를 그대로 쓴다. api/detail.js는 title·description·url만
      갈아끼우고 og:image는 건드리지 않는다. 원본은 docs/assets/og-image-source.png.
      이미지 안에 도메인(wherecho.co.kr)이 찍혀 있으므로 도메인이 바뀌면 이미지도 바꾼다.
    -->
    <meta property="og:image" content="{{SITE_ORIGIN}}/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="어디초 - 우리 아이는 어디 초등학교 갈까? 초등학교 배정부터 입학 준비까지">
    <meta name="twitter:card" content="summary_large_image">
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=8bhvq317xy"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
